<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta
        http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'"
    >
    <link rel="stylesheet" href="style.css">
    <title>Desktop Blocker</title>
</head>

<body>

    <div class="topbar">
        <button id="lock">Bloquear</button>
        <button id="close">×</button>
    </div>

    <main>
        <h1>Escritorio bloqueado</h1>

        <button id="unlock" class="unlock">
            Desbloquear
        </button>
    </main>

    <script src="app.js"></script>
</body>
</html>
