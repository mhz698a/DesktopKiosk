<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>DesktopKiosk</title>
</head>

<body>

    <div class="topbar">
        <button id="close">×</button>
    </div>

    <main>
        <!-- Contenedor de Pestañas -->
        <div class="tabs-container">
            <button class="tab-btn active" onclick="switchTab(event, 'login-panel')">Inicio de sesión</button>
            <button class="tab-btn" onclick="switchTab(event, 'internos-panel')">Registro de alumnos</button>
            <button class="tab-btn" onclick="switchTab(event, 'externos-panel')">Registro de externos</button>
        </div>

        <!-- Panel 1: Inicio de sesión -->
        <div id="login-panel" class="tab-panel active">
            <h1>Inicio de sesión</h1>
            <div class="form-group">
                <input type="text" placeholder="Nombres/Expediente (Ej: 123456 o Mi Nombre)">
            </div>
            <div class="form-group">
                <input type="password" placeholder="Contraseña (Ej: .123456 o .Mi Nombre)">
            </div>
            <button class="unlock">Iniciar sesión</button>
        </div>

        <!-- Panel 2: Registro de internos -->
        <div id="internos-panel" class="tab-panel">
            <h1>Registro de Alumnos</h1>
            <div class="form-group">
                <input type="text" placeholder="Nombres">
            </div>
            <div class="form-group">
                <input type="text" placeholder="Apellidos (Paterno y Materno)">
            </div>
            <div class="form-group">
                <select>
                    <option value="" disabled selected>Facultad perteneciente</option>
                    <option value="informatica">Facultad de Informática</option>
                    <option value="lenguas">Facultad de Lenguas y Letras</option>
                    <option value="ingenieria">Facultad de Ingeniería</option>
                </select>
            </div>
            <div class="form-group">
                <input type="text" placeholder="Expediente">
            </div>
            <button class="unlock">Registrarse</button>
        </div>

        <!-- Panel 3: Registro de externos -->
        <div id="externos-panel" class="tab-panel">
            <h1>Registro de externos</h1>
            <div class="form-group">
                <input type="text" placeholder="Nombres">
            </div>
            <div class="form-group">
                <input type="text" placeholder="Apellidos (Paterno y Materno)">
            </div>
            <div class="form-group">
                <select id="tipo-usuario" onchange="toggleUniversidad(this)">
                    <option value="" disabled selected>Tipo de usuario</option>
                    <option value="estudiante">Estudiante Externo</option>
                    <option value="trabajador">Trabajador Interno</option>
                    <option value="publico">Público en general</option>
                </select>
            </div>
            <div class="form-group" id="uni-group" style="display: none;">
                <input type="text" placeholder="Universidad Perteneciente">
            </div>
            <button class="unlock">Registrarse</button>
        </div>

    </main>

    <footer class="bottombar">
        Coordinación General de Servicios de Informatización
    </footer>

    <script src="app.js"></script>
</body>
</html>
