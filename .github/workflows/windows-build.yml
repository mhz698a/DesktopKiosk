name: Windows build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'fix/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build installer (Windows x64)
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Python for Qt installer
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Qt 6.11.2
        shell: pwsh
        run: |
          # aqtinstall 3.3.0 does not understand the flattened Qt 6.11
          # Windows repository layout. Use the merged upstream fix.
          python -m pip install --upgrade "git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b"

          $qtBase = Join-Path $env:GITHUB_WORKSPACE 'Qt'
          python -m aqt install-qt windows desktop 6.11.2 win64_msvc2022_64 --autodesktop --outputdir $qtBase
          if ($LASTEXITCODE -ne 0) {
            throw "aqtinstall no pudo instalar Qt 6.11.2."
          }

          $qtRoot = Join-Path $qtBase '6.11.2\msvc2022_64'
          $windeployqt = Join-Path $qtRoot 'bin\windeployqt.exe'
          if (-not (Test-Path $windeployqt)) {
            throw "No se encontró windeployqt.exe en $qtRoot."
          }

          "QT_ROOT_DIR=$qtRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Join-Path $qtRoot 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Restore WebView2 native SDK
        shell: pwsh
        run: |
          $version = '1.0.4129.50'
          $package = Join-Path $env:RUNNER_TEMP "microsoft.web.webview2.$version.nupkg"
          $uri = "https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/$version/microsoft.web.webview2.$version.nupkg"
          Invoke-WebRequest -Uri $uri -OutFile $package

          $destination = Join-Path $env:GITHUB_WORKSPACE 'extern\webview2'
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          Expand-Archive -LiteralPath $package -DestinationPath $destination -Force

          $header = Join-Path $destination 'build\native\include\WebView2.h'
          $library = Join-Path $destination 'build\native\x64\WebView2LoaderStatic.lib'
          if (-not (Test-Path $header)) {
            throw "No se encontró WebView2.h dentro del paquete NuGet."
          }
          if (-not (Test-Path $library)) {
            throw "No se encontró WebView2LoaderStatic.lib dentro del paquete NuGet."
          }

      - name: Configure CMake
        shell: pwsh
        run: |
          if (-not $env:QT_ROOT_DIR) {
            throw "install-qt-action no proporcionó QT_ROOT_DIR."
          }
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR"

      - name: Build DesktopKiosk
        run: cmake --build build --config Release --parallel

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Compile installer
        shell: pwsh
        run: |
          $programFilesX86 = [Environment]::GetFolderPath('ProgramFilesX86')
          $compiler = Join-Path $programFilesX86 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) {
            throw "No se encontró ISCC.exe de Inno Setup."
          }
          & $compiler /Qp installer.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup terminó con el código $LASTEXITCODE."
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: DesktopKiosk-Installer-Windows-x64
          path: Output/Installer_DesktopKiosk.exe
          if-no-files-found: error
          retention-days: 14
